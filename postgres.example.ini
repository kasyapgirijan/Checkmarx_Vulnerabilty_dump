[postgres]
# Copy this file to postgres.ini (ignored by Git) and pass it with --db postgres.ini,
# or paste the [postgres] section into config.ini and use --db on its own.
host = localhost
port = 5432
database = checkmarx
user = checkmarx_loader

# Leave empty to use the PGPASSWORD environment variable or your ~/.pgpass
# (%APPDATA%\postgresql\pgpass.conf on Windows) instead of storing it here.
password =

# disable, prefer, require, verify-ca or verify-full. Use verify-full (with
# sslrootcert) for a database on another machine.
sslmode = prefer
# sslrootcert = C:\path\to\root.crt

# Tables are created in this schema on the first run.
schema = checkmarx
