; Named-vulnerability exposure report: python exposure_report.py --config report.ini
; Copy to report.ini (ignored by Git). See README.md, "Exposure report".

[report]
; db: read the PostgreSQL database that checkmarx_exposure.py --db fills.
; Or the path of a checkmarx_exposure.py output folder, for example checkmarx-output\20261118T101500Z
source = db
; Where [postgres] lives when source = db. Leave empty to use a [postgres] section in this file.
db_config = config.ini
; Output CSV; a <name>-summary.csv with one row per vulnerability and project is written beside it.
; Leave empty for vulnerability-report-<UTC time>.csv
output = vulnerability-report.csv
; true writes values exactly as found (no leading ' before = + - @ for Excel).
raw_csv = false

; Every other section is one vulnerability. Name it [Name], or [Name/label] to give one
; vulnerability several package rules with different version ranges.
;
;   cves       CVE IDs; used to say whether Checkmarx reported them, and to catch findings
;              reported under these CVEs that no package rule below matches
;   ecosystem  purl type for SCA packages: maven, npm, pypi, nuget, golang, composer, ...
;              Empty matches any. Not used for container packages.
;   packages   package names as in packages.csv (Maven: group/artifact); * and ? globs allowed
;   affected   version ranges; ',' = AND, ';' = OR. Operators >= > <= < == !=; a bare
;              version means exactly that version
;   fixed      free text shown in the report
;   containers true (default) also checks Container Security packages, by name only
;
; The ranges below are starting points from public advisories. Check them against the
; vendor advisory before relying on the report.

[Log4Shell]
; https://logging.apache.org/security.html
cves = CVE-2021-44228, CVE-2021-45046, CVE-2021-45105, CVE-2021-44832
ecosystem = maven
packages = org.apache.logging.log4j/log4j-core
affected = >=2.0-beta9,<2.3.2 ; >=2.4,<2.12.4 ; >=2.13.0,<2.17.1
fixed = 2.17.1 (Java 8+), 2.12.4 (Java 7), 2.3.2 (Java 6)

[Spring4Shell]
; https://spring.io/security/cve-2022-22965
cves = CVE-2022-22965
ecosystem = maven
packages = org.springframework/spring-beans, org.springframework/spring-webmvc, org.springframework/spring-webflux
affected = <5.2.20 ; >=5.3.0,<5.3.18
fixed = 5.3.18, 5.2.20

[React2Shell/react]
; https://react.dev/blog/2025/12/03/critical-security-vulnerability-in-react-server-components
cves = CVE-2025-55182
ecosystem = npm
packages = react-server-dom-webpack, react-server-dom-parcel, react-server-dom-turbopack
affected = >=19.0.0,<19.0.1 ; >=19.1.0,<19.1.2 ; >=19.2.0,<19.2.1
fixed = 19.0.1, 19.1.2, 19.2.1

[React2Shell/next]
; https://nextjs.org/blog/CVE-2025-66478
cves = CVE-2025-55182, CVE-2025-66478
ecosystem = npm
packages = next
affected = >=15.0.0,<15.0.5 ; >=15.1.0,<15.1.9 ; >=15.2.0,<15.2.6 ; >=15.3.0,<15.3.6 ; >=15.4.0,<15.4.8 ; >=15.5.0,<15.5.7 ; >=16.0.0,<16.0.7
fixed = 15.0.5, 15.1.9, 15.2.6, 15.3.6, 15.4.8, 15.5.7, 16.0.7

; Inventory only: every version of a package in use, all "not_affected" unless a range matches.
; [Java runtime libraries]
; ecosystem = maven
; packages = *
; affected = ==0
