[checkmarx]
# Replace these EU example URLs with your actual Checkmarx region and tenant.
base_url = https://eu.ast.checkmarx.net
token_url = https://eu.iam.checkmarx.net/auth/realms/YOUR_TENANT/protocol/openid-connect/token

# Paste the full API key token, not the Key ID shown in the portal.
# Keep the value on one line, without quotation marks.
api_key = YOUR_API_KEY

# Optional alternative: leave api_key empty and set both OAuth client fields.
client_id =
client_secret =

# TLS certificate verification: true (default), false, or the path to your
# organization's CA bundle (PEM). Prefer a CA bundle over false: with false the
# API key can be intercepted by anyone able to sit on the network path.
verify_ssl = true
